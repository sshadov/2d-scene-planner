<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="disguise-plugin-window-size" content="1440,900" />
    <meta name="disguise-plugin-window-min-size" content="900,620" />
    <meta name="disguise-plugin-window-resizable" content="true" />
    <title>Disguise Scene Planner v11.3</title>
    <link rel="stylesheet" href="./styles.css?v=11.3" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-label="Scene editor">
        <aside class="object-rail designer-panel" id="object-rail">
          <section class="scene-config" aria-label="Scene dimensions">
            <div class="panel-heading"><h1>Scene</h1><span id="object-count">0</span></div>
            <div class="scene-dimensions">
              <label>Width <span class="input-shell"><input id="scene-width" type="text" inputmode="decimal" value="20" /><i>m</i></span></label>
              <label>Depth <span class="input-shell"><input id="scene-depth" type="text" inputmode="decimal" value="12" /><i>m</i></span></label>
            </div>
            <div class="panel-actions">
              <label class="live-toggle" title="Official WebSocket Live Update"><span>LIVE</span><input id="live-toggle" type="checkbox" /><i aria-hidden="true"></i></label>
              <button class="text-button" id="json-button" type="button">Export JSON</button>
              <button class="text-button live-log-button" id="live-log-button" type="button">LIVE log</button>
            </div>
          </section>
          <section class="object-list-panel" aria-label="Scene objects">
            <div class="rail-heading"><h2>Objects</h2><span id="object-count-shadow" aria-hidden="true"></span></div>
            <div id="object-groups" class="object-groups"></div>
          </section>
          <section class="inspector-panel" aria-label="Selected object properties">
            <div class="inspector-heading">Properties</div>
            <div class="active-object-strip" id="active-object-strip" aria-live="polite"></div>
          </section>
          <span id="status-synced" hidden>0</span><span id="status-changed" hidden>0</span><span id="status-errors" hidden>0</span><span id="status-error-chip" hidden></span><span id="scene-summary" hidden>Scene</span><span id="adapter-status" hidden>Designer API: not connected</span>
        </aside>

        <section class="stage-panel">
          <div class="canvas-wrap" id="canvas-wrap">
            <canvas id="scene-canvas" aria-label="Scene plan, top view"></canvas>
            <div class="empty-hint" id="empty-hint">Right-click to add an object</div>
            <div class="canvas-overlay overlay-left" aria-label="History controls">
              <button class="icon-button" id="undo-button" type="button" aria-label="Undo" title="Undo">↶</button>
              <button class="icon-button" id="redo-button" type="button" aria-label="Redo" title="Redo">↷</button>
            </div>
            <div class="canvas-overlay overlay-right" aria-label="View controls">
              <label class="magnet-control"><span>Magnet</span><select id="snap-mode" aria-label="Magnet"><option value="free">Off</option><option value="grid-01">0.1 m</option><option value="grid-1" selected>1 m</option></select></label>
              <div class="zoom-controls"><button class="icon-button" id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">−</button><button class="zoom-level" id="zoom-reset" type="button" title="Reset zoom and view" aria-label="Reset zoom and view">100%</button><button class="icon-button" id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button></div>
            </div>
          </div>
        </section>
      </section>
    </main>

    <details class="live-log-panel" id="live-log-panel">
      <summary>LIVE diagnostics</summary>
      <pre id="live-log-output">No LIVE events yet.</pre>
    </details>

    <menu class="canvas-context-menu" id="canvas-context-menu" hidden>
      <div class="empty-context-actions" id="empty-context-actions" hidden>
          <span class="context-title">Add at this point</span>
        <div class="quick-add-grid">
          <button type="button" data-create-type="screen">LED Screen</button>
          <button type="button" data-create-type="dmxScreen">DMX Screen</button>
          <button type="button" data-create-type="surface">Projection Surface</button>
          <button type="button" data-create-type="projector">Projector</button>
          <button type="button" data-create-type="dmxLight">DMX Light</button>
          <button type="button" data-create-type="camera">Camera</button>
        </div>
      </div>
      <div id="object-context-actions">
         <button type="button" data-action="duplicate">Duplicate</button>
         <button type="button" data-action="rotate-90">Rotate 90°</button>
         <button type="button" data-action="bind-surface" id="context-bind-surface" hidden>Bind to surface ›</button>
        <div class="surface-context-list" id="surface-context-list" hidden></div>
        <div class="menu-separator"></div>
         <button type="button" data-action="mirror-x">Mirror copy on X</button>
         <button type="button" data-action="mirror-z">Mirror copy on Z</button>
        <div class="menu-separator"></div>
         <button class="danger-menu-item" type="button" data-action="delete">Delete</button>
         <div class="context-delete-confirm" id="context-delete-confirm" hidden><span>Delete object?</span><button type="button" id="context-delete-yes">Yes</button><button type="button" id="context-delete-no">No</button></div>
      </div>
    </menu>
    <script src="./designer-adapter.js?v=11.3"></script>
    <script src="./app.js?v=11.3"></script>
  </body>
</html>
